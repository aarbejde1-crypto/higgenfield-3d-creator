name: Fetch Higgsfield clips
on:
  workflow_dispatch:
  push:
    branches:
      - claude/connector-toggle-issue-zprx5m

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download clips
        run: |
          while read -r name url; do
            [ -n "$name" ] || continue
            echo "Fetching $name"
            curl -fsSL --retry 3 -o "clips/${name}.mp4" "$url"
          done < clips/urls.txt
          ls -la clips/
      - name: Commit and push clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clips/*.mp4
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Add downloaded Higgsfield walkthrough clips"
          git push
